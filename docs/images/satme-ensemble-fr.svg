<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Les trois SatMe : SatMe sur le téléphone Android, SatMe-PC sur un PC Linux, Windows ou un Raspberry Pi, et SatMe-Node sur un Raspberry Pi au pied du pylône. Le téléphone rejoint le PC en scannant un QR code : ses passages, contacts, images SSTV et sons arrivent sur le PC. Le PC pilote le node par le réseau. Les trois partagent le même moteur.">
<title>Les trois SatMe : SatMe sur le téléphone Android, SatMe-PC sur un PC Linux, Windows ou un Raspberry Pi, et SatMe-Node sur un Raspberry Pi au pied du pylône. Le téléphone rejoint le PC en scannant un QR code : ses passages, contacts, images SSTV et sons arrivent sur le PC. Le PC pilote le node par le réseau. Les trois partagent le même moteur.</title>
<style>
  text{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif}
  .bg{fill:#ffffff} .box{fill:#ffffff;stroke:#1b2329;stroke-width:1.6} .soft{fill:#f3f6f8;stroke:#c9d2d8}
  .t{fill:#1b2329;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif} .m{fill:#5b6872;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif}
  .acc{fill:#0e9f8e} .accs{stroke:#0e9f8e} .amb{fill:#c27c0e} .ambs{stroke:#c27c0e} .blu{fill:#1f6fb2} .blus{stroke:#1f6fb2}
  .chip{fill:#eef7f6;stroke:#9fd6cf} .ribbon{fill:#e6f4f2;stroke:#0e9f8e} .qr{fill:#1b2329} .scr{fill:#0b1218}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .box{fill:#161b22;stroke:#e3e9ed} .soft{fill:#1c232c;stroke:#3d4a55}
    .t{fill:#e3e9ed} .m{fill:#97a4ad}
    .acc{fill:#3ddcc4} .accs{stroke:#3ddcc4} .amb{fill:#f2b84b} .ambs{stroke:#f2b84b} .blu{fill:#5aa7e8} .blus{stroke:#5aa7e8}
    .chip{fill:#13282a;stroke:#2f6f68} .ribbon{fill:#10221f;stroke:#3ddcc4} .qr{fill:#e3e9ed} .scr{fill:#0b1218}
  }
</style>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker><marker id="mas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="blu"/></marker><marker id="mbs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="blu"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="amb"/></marker><marker id="mcs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="amb"/></marker></defs>
<rect width="1000" height="640" class="bg"/>
<text x="500.0" y="40" class="t" font-size="22" text-anchor="middle" font-weight="700">Une station, trois SatMe</text>
<text x="500.0" y="64" class="m" font-size="14" text-anchor="middle" font-weight="400">le même moteur sur le téléphone, le PC et le Raspberry Pi du pylône</text>
<rect x="370" y="92" width="260" height="54" rx="10" class="soft"/>
<text x="500" y="115" class="t" font-size="14" text-anchor="middle" font-weight="600">Le navigateur</text>
<text x="500" y="135" class="m" font-size="12" text-anchor="middle" font-weight="400">ce PC, une tablette, un autre PC (--reseau)</text>
