<text x="160" y="262" class="acc" font-size="24" text-anchor="middle" font-weight="800">SatMe</text>
<text x="160" y="286" class="m" font-size="13" text-anchor="middle" font-weight="400">Android</text>
<text x="160" y="316" class="m" font-size="12" text-anchor="middle" font-weight="400">en trafic, au portable,</text>
<text x="160" y="336" class="m" font-size="12" text-anchor="middle" font-weight="400">dans la poche : passages,</text>
<text x="160" y="356" class="m" font-size="12" text-anchor="middle" font-weight="400">boussole, Doppler, carnet</text>
<rect x="360" y="190" width="280" height="214" rx="12" class="box"/>
<rect x="376" y="206" width="248" height="182" rx="6" class="scr"/>
<rect x="474" y="404" width="52" height="12" class="soft"/><rect x="444" y="416" width="112" height="7" rx="3.5" class="soft"/>
<text x="500" y="246" class="acc" font-size="24" text-anchor="middle" font-weight="800">SatMe-PC</text>
<text x="500" y="270" class="m" font-size="13" text-anchor="middle" font-weight="400">Linux · Windows · Raspberry Pi</text>
<text x="500" y="298" class="m" font-size="12" text-anchor="middle" font-weight="400">toute la station dans une page :</text>
<text x="500" y="317" class="m" font-size="12" text-anchor="middle" font-weight="400">Doppler, rotor, carnet, journal,</text>
<text x="500" y="336" class="m" font-size="12" text-anchor="middle" font-weight="400">SSTV, METEOR, APRS, FT8, DATV…</text>
<text x="500" y="355" class="m" font-size="12" text-anchor="middle" font-weight="400">mode automatique des passages</text>
<rect x="740" y="210" width="200" height="160" rx="12" class="box"/>
<text x="840" y="250" class="acc" font-size="22" text-anchor="middle" font-weight="800">SatMe-Node</text>
<text x="840" y="273" class="m" font-size="13" text-anchor="middle" font-weight="400">Raspberry Pi au pylône</text>
<text x="840" y="302" class="m" font-size="12" text-anchor="middle" font-weight="400">reçoit le DATV de QO-100</text>
<text x="840" y="321" class="m" font-size="12" text-anchor="middle" font-weight="400">là où est le LNB ; piloté</text>
<text x="840" y="340" class="m" font-size="12" text-anchor="middle" font-weight="400">depuis le PC et le téléphone</text>
