<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-label="Le téléphone se branche en USB-C (OTG) sur un hub USB alimenté ; un chargeur USB-C PD alimente le hub et recharge le téléphone. Sur le hub : IC-9700, l'interface CAT du TS-2000, une carte son USB qui reçoit la BF du TS-2000, une clé RTL-SDR avec une antenne 137 MHz, une interface rotor GS-232, un TH-D72 et une molette USB. La boussole est en Bluetooth, le PC en Wi-Fi.">
<title>Le téléphone se branche en USB-C (OTG) sur un hub USB alimenté ; un chargeur USB-C PD alimente le hub et recharge le téléphone. Sur le hub : IC-9700, l'interface CAT du TS-2000, une carte son USB qui reçoit la BF du TS-2000, une clé RTL-SDR avec une antenne 137 MHz, une interface rotor GS-232, un TH-D72 et une molette USB. La boussole est en Bluetooth, le PC en Wi-Fi.</title>
<style>
  .bg{fill:#ffffff} .box{fill:#ffffff;stroke:#1b2329} .soft{fill:#ffffff;stroke:#c9d2d8}
  .t{fill:#1b2329} .m{fill:#5b6872} .pill{fill:#c9d2d8}
  .usb{stroke:#1f6fb2} .usbt{fill:#1f6fb2} .usbf{fill:#1f6fb2}
  .wire{stroke:#4d5a63} .wiret{fill:#4d5a63} .wiref{fill:#4d5a63}
  .rf{stroke:#b5651d} .rft{fill:#b5651d} .rff{fill:#b5651d}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .box{fill:#161b22;stroke:#e3e9ed} .soft{fill:#161b22;stroke:#3d4a55}
    .t{fill:#e3e9ed} .m{fill:#97a4ad} .pill{fill:#3d4a55}
    .usb{stroke:#5aa7e8} .usbt{fill:#5aa7e8} .usbf{fill:#5aa7e8}
    .wire{stroke:#9fb0bc} .wiret{fill:#9fb0bc} .wiref{fill:#9fb0bc}
    .rf{stroke:#e09a55} .rft{fill:#e09a55} .rff{fill:#e09a55}
  }
  text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px}
  .b{font-weight:600} .s{font-size:11px} .c{text-anchor:middle} .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
</style>
<defs>
<marker id="a-usb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="usbf"/></marker>
<marker id="a-wire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="wiref"/></marker>
<marker id="a-rf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="rff"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="680" rx="12"/>
<rect class="soft" x="20" y="120" width="130" height="50" rx="6" stroke-width="1"/>
<text class="t b c" x="85.0" y="143.0">Boussole</text>
<text class="m s c" x="85.0" y="160.0">WitMotion</text>
<line class="wire" x1="85" y1="170" x2="85" y2="230" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="wiret s" x="92" y="204">Bluetooth</text>
<rect class="soft" x="20" y="480" width="130" height="50" rx="6" stroke-width="1"/>
<text class="t b c" x="85.0" y="503.0">PC</text>
<text class="m s c" x="85.0" y="520.0">pupitre, journal</text>
<line class="wire" x1="85" y1="430" x2="85" y2="480" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="wiret s" x="92" y="459">Wi-Fi</text>
