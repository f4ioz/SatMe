<text class="m s c" x="285" y="358">recharge le tél.</text>
<line class="usb" x1="340" y1="75" x2="428" y2="75" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="160" x2="428" y2="160" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="245" x2="428" y2="245" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="330" x2="428" y2="330" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="415" x2="428" y2="415" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="500" x2="428" y2="500" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="585" x2="428" y2="585" stroke-width="3" marker-end="url(#a-usb)"/>
<text class="usbt s c mono" x="384" y="66">A → B</text>
<text class="usbt s c" x="384" y="321">rallonge</text>
<text class="usbt s c mono" x="384" y="491">A → mini-B</text>
<rect class="box" x="430" y="47" width="210" height="56" rx="6" stroke-width="1"/>
<text class="t b" x="446" y="71">Icom IC-9700</text>
<text class="m s" x="446" y="90">CI-V + son, un seul câble</text>
<rect class="box" x="430" y="132" width="210" height="56" rx="6" stroke-width="1"/>
