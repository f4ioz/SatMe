<rect class="pill" x="70" y="240" width="30" height="5" rx="2.5"/>
<text class="t b c" x="85" y="320" style="font-size:15px">Téléphone</text>
<text class="m c" x="85" y="340">SatMe</text>
<text class="m s c mono" x="85" y="412">USB-C</text>
