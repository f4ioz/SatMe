<rect class="box" x="430" y="472" width="210" height="56" rx="6" stroke-width="1"/>
<text class="t b" x="446" y="496">Kenwood TH-D72</text>
<text class="m s" x="446" y="515">CAT ou KISS (APRS)</text>
<rect class="box" x="430" y="557" width="210" height="56" rx="6" stroke-width="1"/>
