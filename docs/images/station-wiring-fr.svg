<line class="wire" x1="640" y1="415" x2="748" y2="415" stroke-width="2.5" marker-end="url(#a-wire)"/>
<text class="wiret s c mono" x="694" y="406">DIN 8</text>
<line class="usb" x1="430" y1="650" x2="458" y2="650" stroke-width="3"/>
<text class="m s" x="466" y="654">USB</text>
<line class="wire" x1="519.2" y1="650" x2="547.2" y2="650" stroke-width="3"/>
<text class="m s" x="555.2" y="654">câble du poste ou du rotor</text>
<line class="rf" x1="755.6" y1="650" x2="783.6" y2="650" stroke-width="3"/>
<text class="m s" x="791.6" y="654">coaxial</text>
<line class="wire" x1="870.4000000000001" y1="650" x2="898.4000000000001" y2="650" stroke-width="3" stroke-dasharray="5 4"/>
<text class="m s" x="906.4000000000001" y="654">sans fil</text>
</svg>
