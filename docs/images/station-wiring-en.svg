<text class="t b c" x="285" y="322" style="font-size:14px">Powered</text>
<text class="m c" x="285" y="340">USB hub</text>
<text class="m s c" x="285" y="358">charges the phone</text>
<line class="usb" x1="340" y1="75" x2="428" y2="75" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="160" x2="428" y2="160" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="245" x2="428" y2="245" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="330" x2="428" y2="330" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="415" x2="428" y2="415" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="500" x2="428" y2="500" stroke-width="3" marker-end="url(#a-usb)"/>
<line class="usb" x1="340" y1="585" x2="428" y2="585" stroke-width="3" marker-end="url(#a-usb)"/>
<text class="usbt s c mono" x="384" y="66">A → B</text>
<text class="usbt s c" x="384" y="321">extension</text>
<text class="usbt s c mono" x="384" y="491">A → mini-B</text>
<rect class="box" x="430" y="47" width="210" height="56" rx="6" stroke-width="1"/>
<text class="t b" x="446" y="71">Icom IC-9700</text>
<text class="m s" x="446" y="90">CI-V + audio, one cable</text>
<rect class="box" x="430" y="132" width="210" height="56" rx="6" stroke-width="1"/>
<text class="t b" x="446" y="156">CAT interface</text>
<text class="m s" x="446" y="175">e.g. RigExpert Tiny</text>
<rect class="box" x="430" y="217" width="210" height="56" rx="6" stroke-width="1"/>
<text class="t b" x="446" y="241">USB sound card</text>
<text class="m s" x="446" y="260">receive audio</text>
<rect class="box" x="430" y="302" width="210" height="56" rx="6" stroke-width="1"/>
<text class="t b" x="446" y="326">RTL-SDR dongle</text>
<text class="m s" x="446" y="345">METEOR, SSTV, voice</text>
<rect class="box" x="430" y="387" width="210" height="56" rx="6" stroke-width="1"/>
<text class="t b" x="446" y="411">GS-232 interface</text>
<text class="m s" x="446" y="430">rotator control</text>
<rect class="box" x="430" y="472" width="210" height="56" rx="6" stroke-width="1"/>
<text class="t b" x="446" y="496">Kenwood TH-D72</text>
<text class="m s" x="446" y="515">CAT or KISS (APRS)</text>
<rect class="box" x="430" y="557" width="210" height="56" rx="6" stroke-width="1"/>
<text class="t b" x="446" y="581">USB knob / keypad</text>
<text class="m s" x="446" y="600">VFO, keys learned</text>
<rect class="box" x="750" y="132" width="190" height="141" rx="6" stroke-width="2"/>
<text class="t b c" x="845.0" y="200.5">Kenwood TS-2000</text>
<text class="m s c" x="845.0" y="217.5">SAT mode</text>
<line class="wire" x1="640" y1="160" x2="748" y2="160" stroke-width="2.5" marker-end="url(#a-wire)"/>
<text class="wiret s c" x="694" y="151">serial CAT</text>
<line class="wire" x1="750" y1="245" x2="642" y2="245" stroke-width="2.5" marker-end="url(#a-wire)"/>
<text class="wiret s c" x="694" y="236">RX audio</text>
<rect class="box rf" x="750" y="302" width="190" height="56" rx="6" stroke-width="2"/>
<text class="t b c" x="845.0" y="328.0">137 MHz antenna</text>
<text class="m s c" x="845.0" y="345.0">METEOR-M2-3 / M2-4</text>
<line class="rf" x1="750" y1="330" x2="642" y2="330" stroke-width="3" marker-end="url(#a-rf)"/>
<text class="rft s c" x="694" y="321">coax, SMA</text>
<rect class="box" x="750" y="387" width="190" height="56" rx="6" stroke-width="2"/>
<text class="t b c" x="845.0" y="413.0">Yaesu G-5400</text>
<text class="m s c" x="845.0" y="430.0">or G-5500, control box</text>
<line class="wire" x1="640" y1="415" x2="748" y2="415" stroke-width="2.5" marker-end="url(#a-wire)"/>
<text class="wiret s c mono" x="694" y="406">DIN 8</text>
<line class="usb" x1="430" y1="650" x2="458" y2="650" stroke-width="3"/>
<text class="m s" x="466" y="654">USB</text>
<line class="wire" x1="519.2" y1="650" x2="547.2" y2="650" stroke-width="3"/>
<text class="m s" x="555.2" y="654">rig or rotator cable</text>
<line class="rf" x1="717.2" y1="650" x2="745.2" y2="650" stroke-width="3"/>
<text class="m s" x="753.2" y="654">coax</text>
<line class="wire" x1="812.8000000000001" y1="650" x2="840.8000000000001" y2="650" stroke-width="3" stroke-dasharray="5 4"/>
<text class="m s" x="848.8000000000001" y="654">wireless</text>
</svg>
